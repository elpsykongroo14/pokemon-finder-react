name: CI

on:
  push:
    branches: [main, ui/rehaul]
  pull_request:
    branches: [main, ui/rehaul]

jobs:
  # fast gates: everything that runs in node, cheapest first (fail fast)
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

        # Cheapest gate first: a formatting slip fails in seconds,
      # not after the full test run.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

        # Reads dist/, the thing we deploy: nothing dev-only, size budgets met
      - name: Check build output
        run: npm run check:dist

    #slow gate: the profuction build in a real browser, runs in parallel with
    #'test' (no 'needs:'), so the total wait is the slower of the two, not the sum
    e2e:
      runs-on: ubuntu-latest
      timeout-minutes: 15

      steps:
        - name: Check out code
          uses: actions/checkout@v4

        - name: Set up Node
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm

        - name: Install dependencies
          run: npm ci

        #downloads chromium and the linux libraries it needs. not cached on
        #purpose: playwright's CI guide says restoring a cache takes about as
        #long as downloading, and the system libraries cant be cached anyway
        - name: Install Playwright browser
          run: npx playwright install --with-deps chromium

        #playwright.config.ts builds the app and starts 'vite preview' itself
        - name: Run end-to-end tests
          run: npm run test:e2e

        #the HTML report (with traces of any retried test) as a downloadable
        # file on the run's page. !cancelled(): upload it when tests fail too,
        #which is exactly when we need it
        - name: Upload Playwright report
          if: ${{ !cancelled() }}
          uses: actions/upload-artifact@v4
          with:
            name: playwright-report
            path: playwright-report/
            retention-day: 14

  # Preview deploy: only when code is pushed (i.e. merged) into ui/rehaul,
  # and only after the test job above passed.
  preview:
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui/rehaul'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_TCG_PROXY: ${{ secrets.VITE_TCG_PROXY }}
        run: npm run build

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pokemon-finder-react --branch=ui-rehaul
