<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/jersey-10/files/jersey-10-latin-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2"
    />
    <!-- Get the connections to the two hosts we always need open BEFORE the
     first request is made (DNS + TLS cost a round trip each on mobile).
     pokeapi.co is called with fetch(), which is a CORS request, so its
     preconnect needs crossorigin; sprite images are plain <img> loads,
     which use a different connection pool, so theirs must NOT have it. -->
    <link rel="preconnect" href="https://pokeapi.co" crossorigin />
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pokemon-finder-react</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
