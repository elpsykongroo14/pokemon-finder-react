<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=Jersey+10&amp;display=swap">
<style>
body{margin:0;background:#fff;color:#000;font-family:"Archivo",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:#000}a:hover{color:#4a4e57}
*,*::before,*::after{box-sizing:border-box}
img{display:block}
.pf{font-size:16px;line-height:1.5;color:#000;background:#fff}
.wide{font-stretch:125%}
.semi{font-stretch:112%}
.px{font-family:"Jersey 10",ui-monospace,monospace;font-weight:400;letter-spacing:.02em}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.tab{font-variant-numeric:tabular-nums}
ul,ol{list-style:none;margin:0;padding:0}
h1,h2,h3,p,dl,dd,figure{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #000;outline-offset:3px;box-shadow:0 0 0 3px #fff}
.on-dark :focus-visible{outline-color:#fff;box-shadow:0 0 0 3px #000}
.pixel{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- header ---------- */
.hdr{position:relative;z-index:30;display:flex;flex-wrap:wrap;align-items:center;column-gap:32px;row-gap:12px;min-height:72px;padding:12px 40px;background:#fff;border-bottom:2px solid #000}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-stretch:112%;font-size:20px;letter-spacing:-.01em;color:#000;text-decoration:none;white-space:nowrap}
.brand:hover{color:#000}
.brand svg{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.brand:hover svg{transform:rotate(-180deg)}
.nav{display:flex;gap:4px}
.nav a{position:relative;display:inline-flex;align-items:center;height:40px;padding:0 16px;color:#000;text-decoration:none;font-weight:600}
.nav a::before{content:"";position:absolute;inset:0;transform:skewX(-13deg) scaleX(0);transform-origin:left center;background:#eceef1;transition:transform .18s cubic-bezier(.2,.8,.2,1);z-index:-1}
.nav a:hover::before{transform:skewX(-13deg) scaleX(1)}
.nav a.cur{color:#fff}
.nav a.cur::before{background:#000;transform:skewX(-13deg) scaleX(1)}
.hdr-end{margin-left:auto;display:flex;align-items:center;gap:14px}
.search{position:relative;width:min(360px,30vw)}
.search input{width:100%;height:44px;padding:0 14px 0 44px;border:2px solid transparent;border-radius:4px;background:#eceef1;font:inherit;font-size:16px;color:#000;outline:none;transition:background-color .15s,border-color .15s}
.search input::placeholder{color:#4a4e57}
.search input:hover{border-color:#c9cdd4}
.search input:focus{background:#fff;border-color:#000}
.search .s-ico{position:absolute;left:14px;top:12px;width:20px;height:20px;pointer-events:none}
.party{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px;border-radius:4px;color:#000;text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap}
.party:hover{background:#eceef1;color:#000}
.pips{display:flex;gap:4px}
.pip{width:10px;height:18px;transform:skewX(-13deg);box-shadow:inset 0 0 0 2px #c9cdd4;background:#fff}
.pip.on{box-shadow:inset 0 0 0 2px #000}
.pip.pop{animation:pipPop .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes pipPop{0%{transform:skewX(-13deg) scale(1)}35%{transform:skewX(-13deg) scale(1.7,1.35)}100%{transform:skewX(-13deg) scale(1)}}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:4px;background:transparent;cursor:pointer;color:#000}
.icon-btn:hover{background:#eceef1}
.icon-btn svg{transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.icon-btn.gear:hover svg{transform:rotate(60deg)}

/* ---------- slanted buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:0;background:transparent;font-weight:700;font-stretch:112%;font-size:16px;text-decoration:none;cursor:pointer;white-space:nowrap;isolation:isolate}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-13deg);transition:background-color .16s,box-shadow .16s,transform .16s}
.btn>span{display:inline-flex;align-items:center;gap:10px}
.btn svg{flex:none}
.btn:active::before{transform:skewX(-13deg) translateY(2px)}
.btn-light{color:#000}.btn-light::before{background:#fff}
.btn-light:hover{color:#fff}.btn-light:hover::before{background:#000;box-shadow:inset 0 0 0 2px #fff}
.btn-ghost{color:#fff}.btn-ghost::before{box-shadow:inset 0 0 0 2px #fff}
.btn-ghost:hover{color:#000}.btn-ghost:hover::before{background:#fff}
.btn-dark{color:#fff}.btn-dark::before{background:#000}
.btn-dark:hover{color:#000}.btn-dark:hover::before{background:#fff;box-shadow:inset 0 0 0 2px #000}
.btn-line{color:#000}.btn-line::before{background:#fff;box-shadow:inset 0 0 0 2px #000}
.btn-line:hover{color:#fff}.btn-line:hover::before{background:#000}
.btn[aria-pressed="true"] .when-off{display:none}
.btn[aria-pressed="false"] .when-on{display:none}
.btn.small{min-height:40px;padding:0 16px;font-size:15px}
.btn:focus-visible{outline:none;box-shadow:none}
.btn:focus-visible::after,.btn.is-focus::after{content:"";position:absolute;inset:-6px;transform:skewX(-13deg);border:3px solid #000;pointer-events:none}
.on-dark .btn:focus-visible::after,.on-dark .btn.is-focus::after{border-color:#fff}

/* segmented control (shared by sprite options, library views) */
.seg{display:inline-flex;position:relative;isolation:isolate}
.seg::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-13deg);background:#fff;box-shadow:inset 0 0 0 2px #000}
.seg button{position:relative;height:40px;padding:0 16px;border:0;background:transparent;cursor:pointer;font-weight:700;font-size:14px;font-stretch:112%;isolation:isolate}
.seg button::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-13deg)}
.seg button:hover::before{background:#eceef1;box-shadow:inset 0 0 0 2px #000}
.seg button[aria-pressed="true"]{color:#fff}
.seg button[aria-pressed="true"]::before{background:#000}
.seg button>span{display:inline-flex;gap:8px;align-items:center}

/* ---------- type chips ---------- */
.types{display:flex;flex-wrap:wrap;gap:8px}
.tchip{position:relative;display:inline-flex;align-items:center;height:30px;padding:0 14px;font-weight:700;font-stretch:112%;font-size:14px;isolation:isolate}
.tchip::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-13deg);background:var(--c)}
.tchip>span{display:inline-flex;gap:8px;align-items:center}
.tchip .x{display:inline-grid;place-items:center;min-width:30px;height:22px;margin-right:-8px;padding:0 6px;background:#000;color:#fff;font-size:13px;font-variant-numeric:tabular-nums;transform:skewX(-13deg)}
.tchip .x>span{transform:skewX(13deg)}
.tchip.sm{height:24px;padding:0 10px;font-size:12px}
.tchip.lg{height:34px;padding:0 18px;font-size:16px}

/* ---------- the encounter field: sky, ground, bands, platform ---------- */
.field{position:relative;overflow:hidden;isolation:isolate}
.sky{position:absolute;inset:0;z-index:-3}
.ground{position:absolute;left:0;right:0;bottom:0;z-index:-2;background:rgba(0,0,0,.16)}
.ground::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:rgba(0,0,0,.18)}
.bands{position:absolute;inset:-10% -20%;z-index:-1}
.band{position:absolute;top:0;bottom:0;transform:skewX(-13deg)}
.drift .bands{animation:drift 26s linear infinite alternate}
@keyframes drift{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
.platform{position:absolute;border-radius:50%;background:rgba(255,255,255,.34);box-shadow:inset 0 0 0 3px rgba(0,0,0,.16)}
.platform::after{content:"";position:absolute;inset:24% 18%;border-radius:50%;background:rgba(255,255,255,.4)}
.shadow{position:absolute;border-radius:50%;background:rgba(0,0,0,.22)}
.sprite-wrap{position:relative;transform-origin:50% 100%}

/* ---------- stat bars ---------- */
.track{position:relative;display:block;height:14px;background:#eceef1;transform:skewX(-13deg);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;transform-origin:left center}

/* ---------- sections ---------- */
.sec{border-top:2px solid #000;padding-top:16px}
.sec-h{font-size:22px;line-height:1.2;font-weight:800;font-stretch:112%;letter-spacing:-.01em;margin:0 0 20px}

/* ---------- footer ---------- */
.ftr{border-top:2px solid #000;padding:24px 40px 32px;font-size:14px;line-height:1.6;color:#4a4e57;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 40px}
.ftr a{color:#000}

/* ---------- the encounter: one orchestrated moment per new Pokémon ----------
   Paired A/B keyframes: switching the class name restarts the sequence. */
.wipe{position:absolute;top:-10%;bottom:-10%;left:-95%;width:80%;z-index:8;pointer-events:none;transform:skewX(-13deg)}
.wipe.w1{background:#000}
.wipe.w2{background:#fff;width:7%}
.wipe-a{animation:wipeA .64s cubic-bezier(.7,0,.3,1) both}
.wipe-b{animation:wipeB .64s cubic-bezier(.7,0,.3,1) both}
.wipe-a.w2{animation-delay:.06s}.wipe-b.w2{animation-delay:.06s}
@keyframes wipeA{from{left:-95%}to{left:135%}}
@keyframes wipeB{from{left:-95%}to{left:135%}}
.drop-a{animation:dropA .5s cubic-bezier(.2,.8,.2,1) .3s both}
.drop-b{animation:dropB .5s cubic-bezier(.2,.8,.2,1) .3s both}
@keyframes dropA{0%{opacity:0;transform:translateY(-60px)}62%{opacity:1;transform:translateY(0) scale(1.05,.93)}82%{transform:translateY(-6px) scale(.99,1.02)}100%{opacity:1;transform:none}}
@keyframes dropB{0%{opacity:0;transform:translateY(-60px)}62%{opacity:1;transform:translateY(0) scale(1.05,.93)}82%{transform:translateY(-6px) scale(.99,1.02)}100%{opacity:1;transform:none}}
/* silhouette first, then color: how a wild Pokémon appears in Black and White */
.reveal-a{animation:revealA .9s steps(1,end) both}
.reveal-b{animation:revealB .9s steps(1,end) both}
@keyframes revealA{0%,72%{filter:brightness(0)}80%{filter:brightness(0) invert(1)}88%,100%{filter:none}}
@keyframes revealB{0%,72%{filter:brightness(0)}80%{filter:brightness(0) invert(1)}88%,100%{filter:none}}
.plate-a{animation:plateA .46s cubic-bezier(.2,.8,.2,1) .26s both}
.plate-b{animation:plateB .46s cubic-bezier(.2,.8,.2,1) .26s both}
@keyframes plateA{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
@keyframes plateB{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
.grow-a{animation:growA .6s cubic-bezier(.2,.8,.2,1) both}
.grow-b{animation:growB .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growA{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growB{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fade-a{animation:fadeA .4s ease .2s both}
.fade-b{animation:fadeB .4s ease .2s both}
@keyframes fadeA{from{opacity:0}to{opacity:1}}
@keyframes fadeB{from{opacity:0}to{opacity:1}}
.tint{transition:background-color 1ms linear .3s,color 1ms linear .3s}

/* sparkles (shiny on) and heart burst (favorite on) */
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;opacity:0}
.burst-a i,.burst-b i{animation:burst .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.4)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
.st{position:absolute;width:30px;height:30px;opacity:0}
.spark-a .st,.spark-b .st{animation:sparkle .85s cubic-bezier(.2,.8,.2,1) both}
@keyframes sparkle{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1.15) rotate(45deg)}100%{opacity:0;transform:scale(.2) rotate(90deg)}}

/* inline confirmation next to the action that caused it */
.note-line{display:inline-flex;align-items:center;gap:10px;min-height:32px;padding:0 14px;font-size:14px;font-weight:600}
.note-a,.note-b{animation:noteIn .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes noteIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0ms!important}
  .wipe,.burst,.st{display:none}
  .drift .bands{animation:none}
}


/* ---------- hero: the hand of three ---------- */
.lhero{height:560px}
.lhero .ground{height:30%}
.hand{position:absolute;left:0;top:0;bottom:0;width:58%;z-index:2}
.hand .shadow{left:50%;bottom:60px;width:420px;height:40px;margin-left:-210px;background:rgba(0,0,0,.28)}
.hc{position:absolute;left:50%;bottom:86px;width:270px;margin-left:-135px;padding:0;border:0;background:none;cursor:pointer;transform-origin:50% 110%}
.hc.l{transform:translateX(-178px) translateY(18px) rotate(-13deg) scale(.86)}
.hc.r{transform:translateX(178px) translateY(18px) rotate(13deg) scale(.86)}
.hc.c{z-index:2}
.hc .lift{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.hc:hover .lift,.hc:focus-visible .lift{transform:translateY(-14px)}
.hand:hover .hc.l{transform:translateX(-206px) translateY(10px) rotate(-17deg) scale(.86)}
.hand:hover .hc.r{transform:translateX(206px) translateY(10px) rotate(17deg) scale(.86)}
.hc.l,.hc.r{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
@keyframes dealL{0%{opacity:0;transform:translateX(0) translateY(420px) rotate(0) scale(.86)}100%{opacity:1;transform:translateX(-178px) translateY(18px) rotate(-13deg) scale(.86)}}
@keyframes dealR{0%{opacity:0;transform:translateX(0) translateY(420px) rotate(0) scale(.86)}100%{opacity:1;transform:translateX(178px) translateY(18px) rotate(13deg) scale(.86)}}
@keyframes dealC{0%{opacity:0;transform:translateY(420px)}70%{opacity:1;transform:translateY(-12px)}100%{opacity:1;transform:none}}
.deal .hc.c{animation:dealC .7s cubic-bezier(.2,.8,.2,1) .15s both}
.deal .hc.l{animation:dealL .7s cubic-bezier(.2,.8,.2,1) .35s both}
.deal .hc.r{animation:dealR .7s cubic-bezier(.2,.8,.2,1) .45s both}
.lplate{position:absolute;top:0;right:0;bottom:0;width:48%;z-index:3;background:#000;color:#fff;clip-path:polygon(130px 0,100% 0,100% 100%,0 100%);display:flex;align-items:center}
.lplate-in{width:100%;padding:48px 64px 48px 172px;display:flex;flex-direction:column;gap:18px}
.lplate .dex{font-size:28px;line-height:1}
.lplate h1{font-size:60px;line-height:.95;font-weight:900;font-style:italic;letter-spacing:-.02em}
.lplate .lead{font-size:18px;line-height:1.5;color:#d8dbe0;max-width:30em}
.lsearch{display:grid;gap:8px;max-width:420px;margin-top:4px}
.lsearch label{font-size:14px;font-weight:600;color:#d8dbe0}
.lsearch .row{display:flex;gap:10px}
.lsearch input{flex:1;min-width:0;height:44px;padding:0 14px;border:2px solid #fff;border-radius:4px;background:#000;color:#fff;font:inherit;font-size:16px;outline:none}
.lsearch input::placeholder{color:#a3a8b3}
.lsearch input:focus{background:#fff;color:#000}
.lactions{display:flex;flex-wrap:wrap;gap:12px 16px;margin-top:6px}

/* ---------- toolbar ---------- */
.ltool{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid #000}
.ltool-in{max-width:1360px;margin:0 auto;padding:14px 40px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px}
.count{font-size:20px;font-weight:800;font-stretch:112%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:#4a4e57}
.legend li{display:flex;align-items:center;gap:8px}
.ltool-end{margin-left:auto;display:flex;align-items:center;gap:20px}
.sort{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.sort select{height:40px;padding:0 38px 0 12px;border:2px solid #000;border-radius:4px;background:#fff;font:inherit;font-size:15px;font-weight:600;color:#000;appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#000 50%),linear-gradient(135deg,#000 50%,transparent 50%);background-position:calc(100% - 19px) 16px,calc(100% - 13px) 16px;background-size:6px 6px;background-repeat:no-repeat}
.sort select:hover{background-color:#eceef1}

/* ---------- rarity tier marks: one shape language for every view ---------- */
.tier{position:relative;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;font-size:12px;font-weight:700;font-stretch:108%;white-space:nowrap;isolation:isolate}
.tier::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-13deg)}
.tier.common{color:#4a4e57}.tier.common::before{background:#eceef1}
.tier.rare{color:#000}.tier.rare::before{background:#fff;box-shadow:inset 0 0 0 2px #000}
.tier.holo{color:#fff}.tier.holo::before{background:#000}
.tier.ultra{color:#000}.tier.ultra::before{background:linear-gradient(100deg,#ffd6e8,#fff3b0 30%,#c6f7e9 60%,#cdd8ff);box-shadow:inset 0 0 0 2px #000}
.tier svg{width:11px;height:11px}
.mark{display:inline-block;width:14px;height:14px;transform:skewX(-13deg)}
.mark.common{background:#eceef1;box-shadow:inset 0 0 0 1px #c9cdd4}
.mark.rare{background:#fff;box-shadow:inset 0 0 0 2px #000}
.mark.holo{background:#000}
.mark.ultra{background:linear-gradient(100deg,#ffd6e8,#fff3b0 30%,#c6f7e9 60%,#cdd8ff);box-shadow:inset 0 0 0 2px #000}

/* ---------- a card that tilts toward the pointer and catches the light ---------- */
.tc{position:relative;display:block;aspect-ratio:500/698;border-radius:4.6%/3.3%;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .25s;box-shadow:0 8px 18px rgba(0,0,0,.2);background:#1b1b1f}
.tc.live{transition:transform .08s linear,box-shadow .25s}
.tc img{width:100%;height:100%;border-radius:inherit}
.tc .glare,.tc .foil{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s}
.tc .glare{background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.55),rgba(255,255,255,0) 46%);mix-blend-mode:overlay}
.tc .foil{background:linear-gradient(115deg,transparent 22%,rgba(255,60,160,.5) 36%,rgba(255,225,60,.5) 46%,rgba(60,255,200,.5) 56%,rgba(90,130,255,.5) 66%,transparent 80%);background-size:260% 260%;background-position:var(--mx,50%) var(--my,50%);mix-blend-mode:color-dodge}
.tc.on .glare{opacity:1}
.tc.on.holo .foil{opacity:.28}
.tc.on.ultra .foil{opacity:.5}

/* ---------- grid ---------- */
.lbody{max-width:1360px;margin:0 auto;padding:40px 40px 96px}
.group{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px 40px;padding:28px 0 44px;border-top:2px solid #000}
.group:first-child{padding-top:24px}
.ghead{position:sticky;top:96px;align-self:start;display:grid;gap:6px}
.ghead h2{font-size:28px;line-height:1.05;font-weight:900;font-style:italic;font-stretch:118%;letter-spacing:-.01em}
.ghead p{font-size:15px;color:#4a4e57}
.ghead .yr{font-size:15px;font-weight:700;color:#000}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(172px,100%),1fr));gap:36px 24px}
.cgrid>li{min-width:0}
.tile{display:flex;flex-direction:column;gap:12px;width:100%;min-width:0;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:#000}
.tile .lift{display:block;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tile:hover .lift,.tile:focus-visible .lift{transform:translateY(-10px)}
.tile:hover .tc,.tile:focus-visible .tc{box-shadow:0 22px 34px rgba(0,0,0,.28)}
.tile:focus-visible{outline:none}
.tile:focus-visible .tc{outline:3px solid #000;outline-offset:4px}
.tmeta{display:grid;gap:8px}
.tset{font-weight:700;font-size:15px;line-height:1.25}
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px;color:#4a4e57}
.trow .tset{color:#000;min-width:0}
.trow .tab{flex:none}
.in-a .tile{animation:tileA .45s cubic-bezier(.2,.8,.2,1) both}
.in-b .tile{animation:tileB .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes tileA{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes tileB{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- table ---------- */
.ltable{display:grid;font-size:15px}
.lt-row{display:grid;grid-template-columns:64px minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.6fr) minmax(0,1.4fr);align-items:center;column-gap:16px;padding:10px 12px;border-bottom:1px solid #c9cdd4}
.lt-head{padding-top:6px;padding-bottom:10px;border-bottom:2px solid #000;font-size:14px;font-weight:600;color:#4a4e57}
.lt-row.r{transition:background-color .12s}
.lt-row.r:hover{background:#eceef1}
.ltable .thumb{width:46px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.lt-row.r:hover .thumb{transform:rotate(-6deg) scale(1.12)}
.ltable .nm{display:grid;gap:2px;justify-items:start}
.ltable .nm button{padding:0;border:0;background:none;font:inherit;font-weight:700;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:#c9cdd4}

.ltable .sub{font-size:13px;color:#4a4e57}

.in-a .lt-row.r{animation:tileA .35s ease both}
.in-b .lt-row.r{animation:tileB .35s ease both}

/* ---------- binder ---------- */
.binder{position:relative;max-width:1180px;margin:0 auto;padding:28px;background:#000;border-radius:14px;display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);perspective:2200px}
.bpage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:22px;background:#2a2c31;border-radius:6px}
.bpage.l{transform-origin:right center}
.bpage.r{transform-origin:left center}
.bpage.blank{display:flex;align-items:center;justify-content:center}
.endnote{font-size:16px;font-weight:600;color:#a3a8b3}
.spine{display:flex;flex-direction:column;justify-content:space-around;align-items:center}
.ring{width:30px;height:30px;border-radius:50%;border:5px solid #c9cdd4;background:#000}
.pocket{position:relative;aspect-ratio:63/88;border-radius:5px;background:#1d1f23;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.pocket::after{content:"";position:absolute;inset:0;border-radius:5px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.14) 0,rgba(255,255,255,0) 14%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.pocket button{position:absolute;inset:5px;padding:0;border:0;background:none;cursor:pointer}
.pocket .tc{width:100%;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.pocket button:hover .tc,.pocket button:focus-visible .tc{transform:translateY(-6px) scale(1.04);box-shadow:0 14px 24px rgba(0,0,0,.6)}
.pocket button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.bnav{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:24px}
.bnav p{min-width:200px;text-align:center;font-weight:700;font-stretch:112%}
.btn:disabled{opacity:.35;cursor:default}
.next-a .bpage.r{animation:turnInR_A .6s cubic-bezier(.2,.8,.2,1) both}
.next-b .bpage.r{animation:turnInR_B .6s cubic-bezier(.2,.8,.2,1) both}
.next-a .bpage.l,.next-b .bpage.l,.prev-a .bpage.r,.prev-b .bpage.r{animation:fadeA .45s ease both}
.prev-a .bpage.l{animation:turnInL_A .6s cubic-bezier(.2,.8,.2,1) both}
.prev-b .bpage.l{animation:turnInL_B .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes turnInR_A{from{transform:rotateY(-92deg);filter:brightness(.4)}to{transform:none;filter:none}}
@keyframes turnInR_B{from{transform:rotateY(-92deg);filter:brightness(.4)}to{transform:none;filter:none}}
@keyframes turnInL_A{from{transform:rotateY(92deg);filter:brightness(.4)}to{transform:none;filter:none}}
@keyframes turnInL_B{from{transform:rotateY(92deg);filter:brightness(.4)}to{transform:none;filter:none}}

/* ---------- card dialog ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:flex-start;padding:max(4vh,32px) 32px 32px;overflow-y:auto}
.scrim-in{animation:fadeA .2s ease both}
.dlg{position:relative;width:min(1080px,100%);display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:56px;align-items:center;color:#fff}
.dlg-card{perspective:1400px}
.flipper{position:relative;transform-style:preserve-3d}
.flip-a{animation:flipA .7s cubic-bezier(.3,1.2,.4,1) both}
.flip-b{animation:flipB .7s cubic-bezier(.3,1.2,.4,1) both}
@keyframes flipA{from{transform:rotateY(180deg) scale(.9)}to{transform:none}}
@keyframes flipB{from{transform:rotateY(180deg) scale(.9)}to{transform:none}}
.flipper .tc{backface-visibility:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.back{position:absolute;inset:0;border-radius:4.6%/3.3%;background:#000;box-shadow:inset 0 0 0 10px #fff,inset 0 0 0 14px #000,inset 0 0 0 16px #fff;transform:rotateY(180deg);backface-visibility:hidden;display:grid;place-items:center}
.back svg{width:38%;height:auto}
.dlg-info{display:grid;gap:18px;align-content:start}
.dlg-pos{font-size:14px;color:#a3a8b3;font-weight:600}
.dlg h2{font-size:48px;line-height:1;font-weight:900;font-style:italic;font-stretch:118%;letter-spacing:-.02em}
.dlg-sub{font-size:18px;color:#d8dbe0}
.dlg dl{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:28px}
.dlg dt,.dlg dd{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.dlg dt{color:#a3a8b3;font-size:15px}
.dlg dd{font-weight:600}
.dlg-nav{display:flex;flex-wrap:wrap;gap:12px 16px;margin-top:6px}
.dlg-x{position:absolute;top:-8px;right:-8px;color:#fff}
.dlg-x:hover{background:rgba(255,255,255,.16)}
.keys{font-size:13px;color:#a3a8b3}
.keys kbd{display:inline-block;min-width:24px;padding:1px 6px;margin:0 2px;border:1.5px solid #6b7080;border-radius:3px;font:inherit;font-size:12px;text-align:center;color:#fff}

@media (max-width: 1000px){
  .group{grid-template-columns:minmax(0,1fr)}
